name: Build Android app (APK)
on: { workflow_dispatch: {}, push: { tags: ["v*"] } }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: pip install pillow
      - run: npm install
      - run: python3 scripts/prepare_www.py
      - run: npx cap add android
      - run: python3 scripts/patch_android.py
      - run: npx cap sync android
      - name: Restore signing key (optional)
        env:
          KS_B64: ${{ secrets.AW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/aw-release.jks"
            echo "AW_KEYSTORE_FILE=$RUNNER_TEMP/aw-release.jks" >> "$GITHUB_ENV"
            echo "AW_KEYSTORE_PASSWORD=${{ secrets.AW_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "AW_KEY_ALIAS=${{ secrets.AW_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "AW_KEY_PASSWORD=${{ secrets.AW_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No signing key set: the APK will be signed with a temporary debug key."
          fi
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: mkdir -p out && cp android/app/build/outputs/apk/release/*.apk out/AmztoWallmart-Product-Finder-1.8.1.apk
      - uses: actions/upload-artifact@v4
        with: { name: AmztoWallmart-Product-Finder-android, path: out/*.apk }
